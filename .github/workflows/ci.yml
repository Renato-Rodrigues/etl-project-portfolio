# Test gate on every push / pull request. Synthetic data only, no secrets.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # pin to a commit SHA when the repository is created
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,drive]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
