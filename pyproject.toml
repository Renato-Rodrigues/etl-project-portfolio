[project]
name = "etl-dash"
version = "0.1.0"
description = "ETL project portfolio dashboard: parse project-overview docs + REMIND overviews sheet"
requires-python = ">=3.11"
dependencies = ["python-docx>=1.1", "openpyxl>=3.1", "cryptography>=42"]

[project.optional-dependencies]
drive = ["google-auth>=2.30", "requests>=2.31"]
dev = ["pytest>=8", "playwright>=1.45"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real: runs against real local data (ETL_REAL_DOCS / ETL_REAL_SHEET); never in CI"]
addopts = "-m 'not real'"
